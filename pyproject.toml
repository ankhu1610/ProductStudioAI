[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "productstudioai"
version = "0.1.0"
description = "Mask-aware latent diffusion for e-commerce product-background generation."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ankit" }]
dependencies = [
    "accelerate>=1.0",
    "diffusers>=0.35",
    "fastapi>=0.115",
    "gradio>=5.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "safetensors>=0.4",
    "transformers>=4.45",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
tracking = ["mlflow>=2.16"]

[project.scripts]
productstudio-verify = "scripts.verify_environment:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
